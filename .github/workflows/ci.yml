name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Rust, web, and mobile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Build web app
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Check and bundle Expo app
        run: |
          bun run --filter @wolui/mobile typecheck
          bun run --filter @wolui/mobile export:android
      - name: Test Rust workspace
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          cargo +stable fmt --all -- --check
          cargo +stable test --workspace --locked

  image:
    name: Docker image and smoke test
    runs-on: ubuntu-latest
    needs: verify
    concurrency:
      group: ${{ github.workflow }}-ghcr-${{ github.ref }}
      cancel-in-progress: false
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Build image
        run: |
          docker compose -f deploy/compose.yaml config --quiet
          docker build -f deploy/Dockerfile \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t wolui:ci .
      - name: Smoke-test the Docker image
        run: |
          set -euo pipefail
          scratch=$(mktemp -d)
          container=wolui-smoke
          trap 'docker rm -f -v "$container" >/dev/null 2>&1 || true; rm -rf "$scratch"' EXIT
          openssl rand -hex 32 > "$scratch/token"
          chmod 0444 "$scratch/token"
          docker run -d --name "$container" --network host --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            --mount "type=bind,source=$scratch/token,target=/run/secrets/wolui_access_token,readonly" \
            --tmpfs /data:rw,uid=10001,gid=10001,mode=0700 \
            -e WOLUI_LISTEN=0.0.0.0:3000 \
            -e WOLUI_PUBLIC_URL=http://localhost:3000 wolui:ci
          url=http://localhost:3000
          if ! curl --retry 25 --retry-connrefused --retry-delay 1 --fail --silent --show-error "$url/health/ready"; then
            docker logs "$container"
            exit 1
          fi
          docker exec "$container" sh -c 'command -v ssh >/dev/null && command -v tailscale >/dev/null && test -d "$XDG_CONFIG_HOME"'
          curl --fail --silent --show-error "$url/" -o "$scratch/index.html"
          grep -Fq '<div id="root"></div>' "$scratch/index.html"
          jq -Rn --rawfile token "$scratch/token" '{token: ($token | rtrimstr("\n"))}' |
            curl --fail --silent --show-error -o "$scratch/session.json" \
              -H 'Content-Type: application/json' -H "Origin: $url" \
              --data-binary @- "$url/api/v1/sessions"
          jq -e '(.csrf_token | length > 0) and (.session_token | length > 0)' "$scratch/session.json"
          session_token=$(jq -er '.session_token' "$scratch/session.json")
          curl --fail --silent --show-error -H "Authorization: Bearer $session_token" "$url/api/v1/sites" |
            jq -e 'length == 1 and (.[0].id | length > 0)'
      - name: Publish tested image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          sha_image="$image:sha-$GITHUB_SHA"
          sha_error=$(mktemp)
          if docker buildx imagetools inspect "$sha_image" >/dev/null 2>"$sha_error"; then
            echo "Reusing existing immutable image $sha_image"
            docker pull "$sha_image"
          elif grep -Fxq -- "ERROR: $sha_image: not found" "$sha_error"; then
            docker tag wolui:ci "$sha_image"
            docker push "$sha_image"
          else
            cat "$sha_error" >&2
            exit 1
          fi
          rm -f "$sha_error"

          latest_image="$image:latest"
          latest_error=$(mktemp)
          if docker buildx imagetools inspect "$latest_image" >/dev/null 2>"$latest_error"; then
            docker pull "$latest_image"
            latest_revision=$(docker image inspect "$latest_image" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')
            if [[ -z "$latest_revision" ]]; then
              echo "The existing latest image has no revision label; refusing to replace it" >&2
              exit 1
            fi
            comparison=$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $GHCR_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/compare/$latest_revision...$GITHUB_SHA")
            comparison_status=$(jq -er '.status' <<< "$comparison")
            case "$comparison_status" in
              ahead)
                docker tag "$sha_image" "$latest_image"
                docker push "$latest_image"
                ;;
              identical)
                echo "latest already points to $GITHUB_SHA"
                ;;
              behind|diverged)
                echo "Keeping latest at $latest_revision; $GITHUB_SHA is not newer"
                ;;
              *)
                echo "Unexpected commit comparison status: $comparison_status" >&2
                exit 1
                ;;
            esac
          elif grep -Fxq -- "ERROR: $latest_image: not found" "$latest_error"; then
            docker tag "$sha_image" "$latest_image"
            docker push "$latest_image"
          else
            cat "$latest_error" >&2
            exit 1
          fi
          rm -f "$latest_error"
